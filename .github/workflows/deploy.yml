name: Multi-Environment CI/CD Automated Pipeline

on:
  push:
    branches:
      - main     # Main branch push par production active hoga
      - develop  # Develop branch push par staging active hoga

jobs:
  deploy-staging:
    name: 🧪 Deploy to Staging Environment
    if: github.ref == 'refs/heads/develop'  # Sirf tab chalega agar branch 'develop' ho
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Run Secure Staging Deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.STAGING_EC2_HOST }}
        username: ${{ secrets.STAGING_EC2_USERNAME }}
        key: ${{ secrets.STAGING_EC2_SSH_KEY }}
        port: 22
        script: |
          echo "🧪 Connecting to STAGING Server..."
          cd /var/www/portfolio-app
          git fetch origin develop
          git checkout develop
          git pull origin develop
          cd backend && npm ci || npm install --production
          npm run build --if-present
          pm2 restart portfolio-backend || pm2 start index.js --name "portfolio-backend"
          echo "🎉 Staging Deployment Successful & Verified!"

  deploy-production:
    name: 🚀 Deploy to Production Environment
    if: github.ref == 'refs/heads/main'  # Sirf tab chalega agar branch 'main' ho
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Run Secure Production Deployment with Build Validation
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          echo "🚀 Connecting to PRODUCTION Live Server..."
          cd /var/www/portfolio-app
          git fetch origin main
          git checkout main
          git pull origin main
          cd backend && npm ci || npm install --production
          npm run build --if-present
          if [ $? -ne 0 ]; then
            echo "❌ PRODUCTION BUILD FAILED! Aborting release to protect live users."
            exit 1
          fi
          pm2 restart portfolio-backend || pm2 start index.js --name "portfolio-backend"
          echo "🎉 Live Production Deployment is Successful & Isolated!"
