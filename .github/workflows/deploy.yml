name: Multi-Environment CI/CD Automated Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy-staging:
    name: 🧪 Deploy to Staging Environment
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Run Secure Staging Deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.STAGING_EC2_HOST }}
        username: ${{ secrets.STAGING_EC2_USERNAME }}
        key: ${{ secrets.STAGING_EC2_SSH_KEY }}
        port: 22
        script: |
          echo "🧪 Connecting to STAGING Server..."
          cd /var/www/portfolio-app
          git fetch --all
          git checkout -B develop origin/develop
          git pull origin develop
          cd backend && npm install --production
          pm2 restart portfolio-backend || pm2 start index.js --name "portfolio-backend"
          echo "🎉 Staging Deployment Successful & Verified!"

  deploy-production:
    name: 🚀 Deploy to Production Environment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Run Secure Production Deployment with Build Validation
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          echo "🚀 Connecting to PRODUCTION Live Server..."
          cd /var/www/portfolio-app
          git fetch --all
          git checkout main
          git pull origin main
          cd backend && npm install --production
          pm2 restart portfolio-backend || pm2 start index.js --name "portfolio-backend"
          echo "🎉 Live Production Deployment is Successful & Isolated!"
